[package]
name = "pofseed-flock-lift-structure"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A commitment to the fixed tables a wrapped lift's verifier would evaluate, and the proof of their evaluations."
publish = false

[dependencies]
flock-prover = { workspace = true }
rayon = { version = "1.10" }
serde = { version = "1.0.228", features = ["derive"] }
bincode = { version = "1.3" }
pofseed-flock-lift-block = { path = "../block" }
pofseed-flock-lift-whir = { path = "../whir" }

[dev-dependencies]
pofseed-flock-lift-statement = { path = "../statement" }
