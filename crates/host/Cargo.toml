[package]
name = "pofseed-flock-lift-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host side of the Flock lifter: proof generation, proving and verification drivers."
publish = false

[features]
count = ["pofseed-flock-lift/count"]

[dependencies]
flock-prover = { workspace = true }
rayon = { version = "1.10" }
zkboo = { version = "1.2", features = ["u32", "u64", "parallel"] }
zkboo-bip32 = { version = "1.2" }
zkboo-circuit-hash = { version = "1.2" }
zkboo-profiling = { version = "1.2" }
pofseed-flock-lift = { path = "../lift" }
pofseed-flock-lift-block = { path = "../block" }
pofseed-flock-lift-statement = { path = "../statement" }
bincode = { version = "1.3" }
serde = { version = "1.0.228" }

[[bin]]
name = "statement-profile"
path = "src/bin/statement_profile.rs"

[[bin]]
name = "flock-spike"
path = "src/bin/flock_spike.rs"

[[bin]]
name = "chunk-probe"
path = "src/bin/chunk_probe.rs"

[[bin]]
name = "acceptance"
path = "src/bin/acceptance.rs"

[[bin]]
name = "lift-bench"
path = "src/bin/lift_bench.rs"

[[bin]]
name = "verifier-cost"
path = "src/bin/verifier_cost.rs"

[[bin]]
name = "block-stats"
path = "src/bin/block_stats.rs"
