[package]
name = "pofseed-flock-lift"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Flock proofs over batches of response blocks: the prover and verifier of the Flock lifter."
publish = false

[features]
# Counts the verifier's field multiplications and hash compressions, per phase.
count = ["flock-prover/mul-count", "flock-prover/hash-count", "pofseed-flock-lift-block/count"]
# Exposes a matrix prover that forges chosen parts of its proof, for soundness tests.
forgery = []

[dependencies]
flock-prover = { workspace = true }
bincode = { version = "1.3" }
rayon = { version = "1.10" }
serde = { version = "1.0.228", features = ["derive"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }
zkboo = { version = "1.3", features = ["u32", "u64"] }
zkboo-circuit-hash = { version = "1.3" }
pofseed-flock-lift-block = { path = "../block" }
pofseed-flock-lift-structure = { path = "../structure" }
pofseed-flock-lift-statement = { path = "../statement" }

[dev-dependencies]
pofseed-flock-lift-whir = { path = "../whir" }
zkboo = { version = "1.3", features = ["u32", "u64", "parallel"] }
