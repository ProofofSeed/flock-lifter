[package]
name = "pofseed-flock-lift-whir"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WHIR over binary fields, on Flock's GF(2^128) kernels."
publish = false

[dependencies]
flock-prover = { workspace = true }
rayon = { version = "1.10" }
serde = { version = "1.0.228", features = ["derive"] }
bincode = { version = "1.3" }
tiny-keccak = { version = "2.0", features = ["keccak"] }
