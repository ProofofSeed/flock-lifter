# SPDX-License-Identifier: LGPL-3.0-or-later
# Workspace for the Flock lifter: a succinct lift of ZKBoo proofs of seed built on Flock, Succinct's
# batch Boolean R1CS proving system.

[workspace]
resolver = "3"
members = [
    "crates/statement",
    "crates/block",
    "crates/lift",
    "crates/host",
    "crates/evm",
    "crates/optimistic",
    "crates/whir",
    "crates/structure",
]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[workspace.dependencies]
# Flock at revision b684b12 with the additions listed in vendor/flock/VENDORED.md.
flock-prover = { path = "vendor/flock/crates/flock-prover" }

[profile.release]
lto = "thin"
codegen-units = 1
