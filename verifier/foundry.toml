# The Flock lifter's Ethereum verifier. Built with `forge build`; exercised and metered by the
# Rust harness in `crates/evm`, which runs the artefacts in an in-process EVM; there are no
# Solidity tests. `FlockLift`, `FlockMatrix` and `FlockVerifier` exceed EIP-170: see README.md.

[profile.default]
src = "src"
out = "out"
test = "test"
libs = []
solc = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 1
via_ir = false
# The wrap verifier is compiled for cheap execution: its field arithmetic leans on wide constants,
# which the size-minded default would rebuild at run time.
additional_compiler_profiles = [{ name = "wrap", optimizer_runs = 1000000, via_ir = true }]
compilation_restrictions = [{ paths = "src/wrap/**", optimizer_runs = 1000000, via_ir = true }]

[profile.default.optimizer_details]
inliner = false

[lint]
lint_on_build = false
